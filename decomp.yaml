name: Klonoa - Empire of Dreams
repo: https://github.com/testyourmine/kleod
platform: gba
versions:
- name: us
  fullname: US
  sha1: a0a298d9dba1ba15d04a42fc2eb35893d1a9569b
  paths:
    target: baserom.gba
    build_dir: build
    map: kleod.map
    compiled_target: kleod.gba
    elf: kleod.elf
    asm: "asm"
    nonmatchings: "asm/nonmatching"

tools:
  asmlift:
    # asmlift's symbol source: names+addresses from .symtab, declaration shapes and function
    # signatures from the DWARF agbcc's own -g already records, and the GBA I/O register
    # macros from a DWARF macro sidecar. Built by `make asmlift-elf` (a copy of kleod.elf
    # with one extra, non-alloc section) - the ROM and kleod.elf are untouched.
    elf: kleod-syms.elf
  mapfile_parser:
    progress_report:
      report_data: False